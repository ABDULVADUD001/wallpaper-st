<script>
  async function loadWallpapers() {
    const status = document.getElementById("status");
    const grid = document.getElementById("grid");
    
    grid.innerHTML = "";
    status.textContent = "Rasmlar yuklanmoqda...";

    // URL ni qo‘shtirnoq ichiga oldik
    let url = "https://api.waifu.im/search?is_nsfw=false&limit=30";

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("API xatosi");

      const data = await response.json();

      if (!data.images || data.images.length === 0) {
        status.textContent = "😕 Rasm topilmadi.";
        return;
      }

      status.textContent = "✨ " + data.images.length + " ta wallpaper";

      data.images.forEach(item => {
        const card = document.createElement("div");
        card.className = "wallpaper";

        const img = document.createElement("img");
        img.src = item.url;
        img.loading = "lazy";
        img.alt = "Anime Wallpaper";

        const download = document.createElement("button");
        download.className = "download";
        download.textContent = "↓";

        download.onclick = () => {
          window.open(item.url, "_blank");
        };

        card.appendChild(img);
        card.appendChild(download);
        grid.appendChild(card);
      });

    } catch (error) {
      console.error(error);
      status.textContent = "❌ Rasmlarni yuklashda xatolik yuz berdi.";
    }
  }

  loadWallpapers();
</script>
