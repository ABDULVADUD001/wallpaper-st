<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Wallpapers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 15px;
    }
    h2 {
      text-align: center;
      margin-bottom: 15px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      outline: none;
    }
    #status {
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      color: #94a3b8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .wallpaper {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background-color: #1e293b;
      aspect-ratio: 9/16;
    }
    .wallpaper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .download {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Anime Wallpapers</h2>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Anime nomini yozing...">
  </div>

  <div id="status">Yuklanmoqda...</div>

  <div class="grid" id="grid"></div>

  <script>
    async function loadWallpapers(query, type = "") {
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      
      grid.innerHTML = "";
      status.textContent = "Rasmlar yuklanmoqda...";

      let url = https://api.waifu.im/search?included_tags=${query}&limit=30;

      if (type === "portrait") {
        url += "&Orientation=Portrait";
      }

      try {
        const response = await fetch(url, {
          headers: {
            "Accept-Version": "v7"
          }
        });

        if (!response.ok) {
          throw new Error("API xatosi");
        }

        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          status.textContent = "😕 Rasm topilmadi.";
          return;
        }

        status.textContent = "✨ " + data.items.length + " ta wallpaper";

        data.items.forEach(item => {
          const card = document.createElement("div");
          card.className = "wallpaper";

          const img = document.createElement("img");
          img.src = item.url;
          img.loading = "lazy";
          img.alt = "Anime Wallpaper";

          const download = document.createElement("button");
          download.className = "download";
          download.textContent = "↓";

          download.onclick = () => {
            window.open(item.url, "_blank");
          };

          card.appendChild(img);
          card.appendChild(download);
          grid.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        status.textContent = "❌ Rasmlarni yuklashda xatolik yuz berdi.";
      }
    }

    function searchAnime() {
      const input = document.getElementById("searchInput").value.trim();

      if (!input) {
        loadWallpapers("waifu");
        return;
      }

      const status = document.getElementById("status");
      status.textContent = '🔎 "' + input + '" qidirilmoqda...';

      loadWallpapers(input);
    }

    document.getElementById("searchInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchAnime();
      }
    });

    loadWallpapers("waifu");
  </script>

</body>
</html>
