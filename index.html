<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Wallpaper</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #101426;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .box {
      padding: 30px;
    }

    h1 {
      font-size: 28px;
    }

    p {
      color: #aaa;
    }

    button {
      border: 0;
      padding: 14px 25px;
      border-radius: 12px;
      background: #713cff;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🌌 Anime Wallpaper</h1>
    <p>Mini App muvaffaqiyatli ochildi! ✅</p>

    <button onclick="test()">
      🔥 Test
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function test() {
      tg.showAlert("Mini App ishlayapti! ✅");
    }
  </script>

</body>
</html>
